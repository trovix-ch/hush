[package]
name = "hush"
description = "Local-only voice dictation for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["llama-cpp"]
# The embedded LLM normalizer; without it cleanup is rules-only or over HTTP.
llama-cpp = ["hush-normalize/llama-cpp", "hush-stt/transcribe-shared"]

[dependencies]
hush-core = { path = "../../crates/core" }
hush-audio = { path = "../../crates/audio" }
hush-stt = { path = "../../crates/stt" }
hush-normalize = { path = "../../crates/normalize", default-features = false }
hush-platform-windows ={ path = "../../crates/platform-windows" }
anyhow = "1"
ctrlc = "3"
hound = "3.5"
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# No TLS: the only server this talks to is the user's own local inference server.
ureq = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
