[package]
name = "bench-normalize"
description = "Run transcripts through each normalizer and print timings and validation results"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["llama-cpp"]
llama-cpp = ["hush-normalize/llama-cpp"]

[dependencies]
hush-core = { path = "../../crates/core" }
hush-normalize = { path = "../../crates/normalize", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
