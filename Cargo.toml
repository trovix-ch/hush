[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/audio",
    "crates/stt",
    "crates/normalize",
    "crates/platform-windows",
    "apps/whisper-local",
    "tools/bench-stt",
    "tools/bench-normalize",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/trovix/whisper-local"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
