[package]
name = "hush-stt"
description = "Model manifest, the speech worker client and the ONNX fallback engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Off by default: no ONNX Runtime in default builds; ggml/Vulkan measured about 2x faster.
ort-engine = ["dep:parakeet-rs", "dep:ort"]

[dependencies]
hush-core ={ path = "../core" }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sha2 = "0.10"
ureq = "3"
# Pinned exactly: pre-1.0 ONNX wrappers that break API in patches and must agree on `ort`.
parakeet-rs = { version = "=0.3.8", optional = true, default-features = false, features = ["cpu", "ort-defaults", "api-28"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "api-28"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
parakeet-rs = { version = "=0.3.8", optional = true, default-features = false, features = ["directml"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["directml"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
