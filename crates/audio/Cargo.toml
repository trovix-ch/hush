[package]
name = "wl-audio"
description = "Microphone capture, resampling and voice activity detection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wl-core = { path = "../core" }
cpal = "0.18.2"
# rubato broke its API twice in 2026 (v4, v5); pinned exactly.
rubato = "=5.0.0"
audioadapter-buffers = "5.1"
rtrb = "0.3"
thiserror = "2"
tracing = "0.1"
# Pinned exactly: pre-1.0, and the Silero graph needs a replacement for its `If` parser
# that leans on tract internals.
tract-onnx = { version = "=0.23.8", optional = true }

[features]
default = []
# Off by default until the driver uses it: about 90 more crates and assembled kernels.
silero = ["dep:tract-onnx"]

[dev-dependencies]
hound = "3.5"
ctrlc = "3"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[lints]
workspace = true
