[package]
name = "wl-audio"
description = "Microphone capture, resampling and voice activity detection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wl-core = { path = "../core" }
cpal = "0.18.2"
# rubato broke its API twice in 2026 (v4, v5); pinned exactly.
rubato = "=5.0.0"
audioadapter-buffers = "5.1"
rtrb = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
hound = "3.5"
ctrlc = "3"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[lints]
workspace = true
